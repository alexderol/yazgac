<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6fed"/>
      <stop offset="1" stop-color="#1b3fa6"/>
    </linearGradient>
    <linearGradient id="pen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#f4a300"/>
    </linearGradient>
  </defs>
  <!-- Arka plan -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <!-- Sayfa -->
  <rect x="52" y="44" width="124" height="168" rx="14" fill="#ffffff"/>
  <rect x="52" y="44" width="124" height="168" rx="14" fill="none" stroke="#dbe3f5" stroke-width="3"/>
  <!-- Satırlar -->
  <rect x="72" y="76" width="84" height="8" rx="4" fill="#cfd8ea"/>
  <rect x="72" y="100" width="70" height="8" rx="4" fill="#cfd8ea"/>
  <rect x="72" y="124" width="84" height="8" rx="4" fill="#cfd8ea"/>
  <!-- Tablo hücreleri (Excel vurgusu) -->
  <g fill="none" stroke="#9fb3d9" stroke-width="3">
    <rect x="72" y="150" width="40" height="22" fill="#e8f0ff"/>
    <rect x="112" y="150" width="40" height="22" fill="#e8f0ff"/>
    <rect x="72" y="172" width="40" height="22" fill="#e8f0ff"/>
    <rect x="112" y="172" width="40" height="22" fill="#e8f0ff"/>
  </g>
  <!-- Kalem (Yazgaç) -->
  <g transform="rotate(45 170 140)">
    <rect x="156" y="40" width="30" height="150" rx="4" fill="url(#pen)"/>
    <rect x="156" y="40" width="30" height="24" rx="4" fill="#e85d5d"/>
    <rect x="156" y="64" width="30" height="8" fill="#c9c9c9"/>
    <polygon points="156,190 186,190 171,222" fill="#f3d9b1"/>
    <polygon points="165,208 177,208 171,222" fill="#333333"/>
  </g>
</svg>
