<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Yazgaç</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Başlangıç ekranı -->
  <section id="start" class="screen">
    <h1>Yazgaç</h1>
    <p>Word (.docx) ve Excel (.xlsx) dosyalarını açın veya yeni bir belge oluşturun.</p>
    <div class="start-buttons">
      <button data-action="open" class="big">📂 Dosya Aç</button>
      <button data-action="new-word" class="big">📝 Yeni Word Belgesi</button>
      <button data-action="new-excel" class="big">📊 Yeni Excel Tablosu</button>
    </div>
    <p class="hint">Kısayollar: Ctrl+O aç · Ctrl+S kaydet · Ctrl+N yeni Word · Ctrl+Shift+N yeni Excel</p>
  </section>

  <!-- Word editörü -->
  <section id="word" class="screen hidden">
    <div class="toolbar">
      <button data-action="open" title="Aç (Ctrl+O)">📂</button>
      <button data-action="save" title="Kaydet (Ctrl+S)">💾</button>
      <button data-action="save-as" title="Farklı Kaydet">💾…</button>
      <span class="sep"></span>
      <select id="blockStyle" title="Paragraf stili">
        <option value="p">Normal</option>
        <option value="h1">Başlık 1</option>
        <option value="h2">Başlık 2</option>
        <option value="h3">Başlık 3</option>
      </select>
      <span class="sep"></span>
      <button data-cmd="bold" title="Kalın (Ctrl+B)"><b>K</b></button>
      <button data-cmd="italic" title="İtalik (Ctrl+I)"><i>İ</i></button>
      <button data-cmd="underline" title="Altı çizili (Ctrl+U)"><u>A</u></button>
      <button data-cmd="strikeThrough" title="Üstü çizili"><s>Ü</s></button>
      <span class="sep"></span>
      <button data-cmd="justifyLeft" title="Sola hizala">⬅</button>
      <button data-cmd="justifyCenter" title="Ortala">↔</button>
      <button data-cmd="justifyRight" title="Sağa hizala">➡</button>
      <button data-cmd="justifyFull" title="İki yana yasla">☰</button>
      <span class="sep"></span>
      <button data-cmd="insertUnorderedList" title="Madde işaretli liste">• Liste</button>
      <button data-cmd="insertOrderedList" title="Numaralı liste">1. Liste</button>
      <span class="sep"></span>
      <button data-cmd="undo" title="Geri al">↶</button>
      <button data-cmd="redo" title="Yinele">↷</button>
      <span class="spacer"></span>
      <button data-action="home" title="Başlangıç ekranı">🏠</button>
    </div>
    <div class="page-wrap">
      <div id="editor" class="page" contenteditable="true" spellcheck="false"></div>
    </div>
  </section>

  <!-- Excel editörü -->
  <section id="excel" class="screen hidden">
    <div class="toolbar">
      <button data-action="open" title="Aç (Ctrl+O)">📂</button>
      <button data-action="save" title="Kaydet (Ctrl+S)">💾</button>
      <button data-action="save-as" title="Farklı Kaydet">💾…</button>
      <span class="sep"></span>
      <button data-xl="add-row" title="Satır ekle">+ Satır</button>
      <button data-xl="add-col" title="Sütun ekle">+ Sütun</button>
      <button data-xl="del-row" title="Seçili satırı sil">− Satır</button>
      <button data-xl="del-col" title="Seçili sütunu sil">− Sütun</button>
      <span class="sep"></span>
      <button data-xl="add-sheet" title="Yeni sayfa">+ Sayfa</button>
      <button data-xl="rename-sheet" title="Sayfayı yeniden adlandır">✏ Sayfa</button>
      <button data-xl="del-sheet" title="Sayfayı sil">− Sayfa</button>
      <span class="spacer"></span>
      <span id="cellInfo" class="cell-info">A1</span>
      <button data-action="home" title="Başlangıç ekranı">🏠</button>
    </div>
    <div class="formula-bar">
      <span id="cellName">A1</span>
      <input id="formulaInput" type="text" placeholder="Hücre değeri veya formül (=A1+B1)">
    </div>
    <div class="grid-wrap">
      <table id="grid"></table>
    </div>
    <div id="sheetTabs" class="sheet-tabs"></div>
  </section>

  <div id="status" class="status"></div>

  <script src="renderer.js"></script>
</body>
</html>
